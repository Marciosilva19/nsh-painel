<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NSH Painel">
<meta name="theme-color" content="#0A0A0B">
<title>NSH · Gestão</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --ink:#0A0A0B;--panel:#141415;--panel-2:#1C1C1E;--line:#29292C;--line-soft:#202023;
    --paper:#EDEDEF;--muted:#8E8E96;
    --brand:#EE6331;--brand-dark:#C14D24;--brand-ink:#FFFFFF;--brand-soft:rgba(238,99,49,0.14);
    --good:#4ADE80;--warn:#F87171;--amber:#FBBF24;
    --r-lg:16px;--r-md:12px;--r-sm:10px;
    --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);
    font-family:var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
  body{-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  .good-text{color:var(--good);} .warn-text{color:var(--warn);} .amber-text{color:var(--amber);}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  /* ---------- Estrutura ---------- */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
    max-width:520px;margin:0 auto;background:var(--ink);}
  #app-header{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:var(--ink);}
  .brand-mark{font-weight:700;font-size:12px;letter-spacing:0.06em;color:var(--brand-ink);background:var(--brand);border-radius:8px;padding:6px 8px;line-height:1;}
  .header-title{flex:1 1 auto;font-size:16px;font-weight:600;line-height:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mode-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;flex:0 0 auto;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto;}
  .sync-dot.sync-warn{background:var(--warn);}
  .icon-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);border-radius:10px;display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex:0 0 auto;font-size:15px;padding:0;}
  .icon-btn svg{width:20px;height:20px;}

  main#app-content{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .section-label{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;}
  .tab-sub{color:var(--muted);font-size:13px;line-height:1.5;}
  .intro{margin-bottom:14px;}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5;}
  .loading-state{color:var(--muted);font-size:13px;padding:40px 0;text-align:center;}
  .empty-state{color:var(--muted);font-size:13px;line-height:1.5;text-align:center;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--r-md);}

  #app-nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);}
  .nav-btn{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--muted);padding:10px 2px 8px;font-size:11px;font-weight:500;}
  .nav-btn svg{width:22px;height:22px;}
  .nav-btn.on{color:var(--paper);}
  .nav-btn.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--brand);border-radius:0 0 2px 2px;}
  .nav-btn.on svg{color:var(--brand);}

  /* ---------- Cartões ---------- */
  .card{position:relative;overflow:hidden;background:linear-gradient(150deg,#1F1F21 0%,#111112 72%);border:1px solid rgba(255,255,255,0.07);border-radius:var(--r-lg);padding:16px;}
  .card::after{content:'';position:absolute;right:-70px;top:-90px;width:190px;height:190px;border-radius:50%;border:1px solid rgba(255,255,255,0.05);
    background:radial-gradient(circle at 25% 75%,rgba(255,255,255,0.06),transparent 62%);pointer-events:none;}
  .card > *{position:relative;z-index:1;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;}
  .card-title svg{width:15px;height:15px;color:var(--brand);flex:0 0 auto;}

  .hero{padding:0;background:radial-gradient(120% 150% at 100% 0%,rgba(238,99,49,0.22),transparent 55%),linear-gradient(150deg,#1F1F21 0%,#101011 75%);}
  .hero::after{display:none;}
  .hero-main{padding:18px 18px 16px;}
  .hero-brand{font-size:12px;font-weight:600;letter-spacing:0.14em;}
  .hero-label{font-size:12.5px;color:var(--muted);margin-top:10px;}
  .hero-big{font-size:38px;font-weight:600;letter-spacing:-0.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;}
  .pill-badge{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--good);background:rgba(74,222,128,0.12);border-radius:999px;padding:4px 10px;}
  .pill-badge.neg{color:var(--warn);background:rgba(248,113,113,0.12);}
  .hero-split{display:flex;border-top:1px solid var(--line);}
  .hero-split > div{flex:1 1 0;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px;}
  .hero-split > div + div{border-left:1px solid var(--line);}
  .hero-split span{font-size:11.5px;color:var(--muted);}
  .hero-split strong{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}

  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .trio > div{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .trio span{font-size:11.5px;color:var(--muted);}
  .trio strong{font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
  .trio.money strong{font-size:15.5px;}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--panel-2);color:var(--muted);white-space:nowrap;}
  .tag-good{color:var(--good);background:rgba(74,222,128,0.12);}
  .tag-warn{color:var(--amber);background:rgba(251,191,36,0.12);}
  .tag-bad{color:var(--warn);background:rgba(248,113,113,0.12);}
  .tag-brand{color:var(--brand);background:var(--brand-soft);}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:13px 14px;display:flex;flex-direction:column;gap:6px;}
  .stat-card span{font-size:12px;color:var(--muted);}
  .stat-card strong{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}

  /* ---------- Gráficos ---------- */
  .bars{display:flex;flex-direction:column;gap:12px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{width:112px;flex:0 0 auto;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1 1 auto;min-width:30px;height:8px;background:#232326;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:#55555C;}
  .bar-fill.cost{background:#3A3A3F;}
  .bar-fill.profit{background:repeating-linear-gradient(135deg,var(--brand) 0 5px,var(--brand-dark) 5px 10px);}
  .bar-fill.loss{background:var(--warn);}
  .bar-value{width:78px;flex:0 0 auto;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;}

  .gauge{position:relative;max-width:250px;margin:4px auto 0;}
  .gauge svg{width:100%;display:block;}
  .gauge-val{position:absolute;left:0;right:0;bottom:0;text-align:center;}
  .gauge-val strong{display:block;font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;}
  .gauge-val span{font-size:11.5px;color:var(--muted);}
  .gauge-scale{display:flex;justify-content:space-between;max-width:250px;margin:6px auto 0;font-size:11px;color:var(--muted);}

  .insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;line-height:1.5;}
  .insight:last-child{border-bottom:none;padding-bottom:0;}
  .card-title + .insight{padding-top:0;}
  .insight i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--good);}
  .insight.warn i{background:var(--amber);} .insight.bad i{background:var(--warn);}
  .insight b{font-weight:600;}

  /* ---------- Botões ---------- */
  .btn-primary,.btn-secondary,.btn-danger,.btn-ghost{border-radius:var(--r-sm);border:1px solid transparent;font-size:14px;font-weight:600;padding:12px 16px;min-height:44px;}
  .btn-primary{background:var(--brand);color:var(--brand-ink);}
  .btn-secondary{background:var(--panel-2);border-color:var(--line);color:var(--paper);}
  .btn-danger{background:transparent;border-color:rgba(248,113,113,0.5);color:var(--warn);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--muted);font-size:12.5px;padding:8px 12px;min-height:36px;}
  .is-off{opacity:0.45;}
  .wide-btn{width:100%;margin-top:14px;}
  .btn-row{display:flex;gap:8px;margin-top:12px;}
  .btn-row > button{flex:1 1 0;min-width:0;padding-left:8px;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btn-add{width:100%;padding:14px;border-radius:var(--r-md);border:1px dashed var(--line);background:transparent;color:var(--paper);font-size:14px;font-weight:600;margin-top:12px;}
  .btn-add:active{border-color:var(--brand);}
  .back-btn{background:none;border:none;color:var(--brand);font-size:14px;font-weight:600;padding:4px 0;margin:-6px 0 10px;display:inline-flex;align-items:center;gap:4px;min-height:36px;}

  .pill-row{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{flex:0 0 auto;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;font-weight:500;padding:8px 14px;}
  .pill.on{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:600;}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;}
  .seg-btn{border:none;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:9px 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;}
  .seg-btn.on{background:var(--panel-2);color:var(--paper);box-shadow:inset 0 0 0 1px var(--line);}
  .seg-badge{font-size:11px;background:var(--brand);color:#fff;border-radius:999px;padding:1px 7px;line-height:1.5;}

  /* ---------- Produtos ---------- */
  .product-card{width:100%;text-align:left;color:var(--paper);padding:14px 14px 14px 17px;display:block;font-family:inherit;}
  .product-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line);z-index:2;}
  .product-card.h-good::before{background:var(--good);}
  .product-card.h-warn::before{background:var(--amber);}
  .product-card.h-bad::before{background:var(--warn);}
  .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .product-name{font-size:15px;font-weight:600;}
  .product-sku{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono);}
  .pc-price{text-align:right;flex:0 0 auto;}
  .pc-price strong{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
  .pc-price span{font-size:11px;color:var(--muted);}
  .mini-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);}
  .mini-stat span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-stat strong{display:block;font-size:13.5px;font-weight:600;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* ---------- Stock ---------- */
  .stock-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .stock-tot{text-align:right;flex:0 0 auto;}
  .stock-tot strong{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stock-tot span{font-size:11px;color:var(--muted);}
  .vgrid{display:grid;grid-template-columns:minmax(0,1fr) 50px 44px 52px;align-items:center;gap:6px;width:100%;}
  .vgrid > span{text-align:right;font-variant-numeric:tabular-nums;}
  .vgrid > span:first-child{text-align:left;}
  .vgrid-head{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;padding:0 8px 6px;}
  .vrow{background:transparent;border:none;border-top:1px solid var(--line-soft);padding:11px 8px;font-family:inherit;font-size:14px;color:var(--paper);text-align:left;border-radius:0;margin:0;}
  .vrow:active{background:var(--panel-2);}
  .vname{display:flex !important;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;}
  .vname em{font-style:normal;overflow:hidden;text-overflow:ellipsis;}
  .vname i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto;}
  .st-low .vname i{background:var(--amber);}
  .st-out .vname i,.st-short .vname i{background:var(--warn);}
  .st-low .vav{color:var(--amber);font-weight:600;}
  .st-out .vav,.st-short .vav{color:var(--warn);font-weight:600;}
  .vres{color:var(--muted);}

  .move-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);text-align:left;color:var(--paper);font-family:inherit;}
  .move-row:active{background:var(--panel-2);}
  .move-main{min-width:0;}
  .move-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .move-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .move-qty{flex:0 0 auto;text-align:right;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
  .move-qty small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px;}
  .move-qty.pos{color:var(--good);}

  .res-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .res-line{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13.5px;line-height:1.4;}
  .res-line strong{flex:0 0 auto;font-variant-numeric:tabular-nums;}
  .res-note{font-size:12px;color:var(--muted);margin-top:8px;}
  .closed-row{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted);}
  .closed-row div{min-width:0;}
  .closed-row b{color:var(--paper);font-weight:500;}

  /* ---------- Mais / Coleções ---------- */
  .menu-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;text-align:left;font-family:inherit;color:var(--paper);}
  .menu-row strong{display:block;font-size:15px;font-weight:600;}
  .menu-row span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;}
  .menu-row i{font-style:normal;font-size:22px;color:var(--muted);flex:0 0 auto;}
  .col-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .col-name{font-size:16px;font-weight:600;}
  .st-bar{height:10px;border-radius:6px;background:#232326;overflow:hidden;margin:14px 0 6px;}
  .st-bar > div{height:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--brand) 0 5px,var(--brand-dark) 5px 10px);}
  .st-legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);}
  .st-legend b{color:var(--paper);font-weight:600;}
  .col-prods{margin-top:12px;}
  .col-prod{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:9px 0;border-top:1px solid var(--line-soft);}
  .col-prod span:last-child{color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums;}

  .list-card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;}
  .list-card-title{font-size:14.5px;font-weight:600;}
  .list-card-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .list-card-actions{display:flex;gap:6px;flex:0 0 auto;}

  /* ---------- Simulação ---------- */
  .share-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .share-title{font-size:14.5px;font-weight:600;}
  .share-input{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .share-input input{width:78px;text-align:right;}
  .share-input span{color:var(--muted);font-size:14px;}
  .sim-row-name{font-size:14.5px;font-weight:600;margin-bottom:10px;}
  .sim-row-units{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .sim-units-input{width:96px !important;flex:0 0 auto;}
  .sim-units-label{font-size:12px;color:var(--muted);}
  .sim-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:11.5px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line-soft);}
  .sim-figs > span:last-child{text-align:right;}
  .sim-figs strong{display:block;font-size:13.5px;color:var(--paper);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
  .sim-figs strong.warn-text{color:var(--warn);}

  .kv-card{padding:4px 16px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft);}
  .kv:last-child{border-bottom:none;}
  .kv span{font-size:13px;color:var(--muted);}
  .kv span em{font-style:normal;opacity:0.7;}
  .kv strong{font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
  .kv.total{border-top:1px solid var(--line);margin-top:2px;}

  /* ---------- Formulários ---------- */
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .label-text{display:block;margin-bottom:6px;font-weight:500;}
  .field-row{display:flex;gap:10px;}
  .field-row > label{flex:1 1 0;min-width:0;}
  input,select,textarea{font-size:16px;font-family:var(--font);font-variant-numeric:tabular-nums;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:12px 13px;color:var(--paper);width:100%;-webkit-appearance:none;appearance:none;min-height:46px;margin:0;}
  input[type=date]{display:block;min-width:0;text-align:left;}
  input[type=date]::-webkit-date-and-time-value{text-align:left;}
  select{padding-right:34px;}
  textarea{min-height:90px;resize:vertical;font-family:var(--mono);}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:0.6;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(238,99,49,0.16);}

  #modal-root{position:fixed;inset:0;z-index:200;pointer-events:none;}

  .modal-sheet{width:100%;max-width:520px;max-height:90vh;max-height:90dvh;background:var(--ink);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
    display:flex;flex-direction:column;overflow:hidden;animation:slideUp 0.22s ease;}
  .modal-sheet-sm{max-height:72vh;max-height:72dvh;}
  .modal-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}

  .modal-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;}
  .modal-foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);}
  .modal-foot-actions{display:flex;gap:8px;margin-left:auto;}
  .confirm-sheet{width:calc(100% - 32px);max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin:auto;animation:popIn 0.18s ease;}
  .confirm-sheet p{font-size:14.5px;line-height:1.5;margin-bottom:16px;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @keyframes popIn{from{transform:scale(0.96);opacity:0;}to{transform:scale(1);opacity:1;}}

  #toast-root{position:fixed;top:0;left:0;right:0;z-index:300;display:flex;justify-content:center;pointer-events:none;}
  .toast{margin-top:calc(10px + env(safe-area-inset-top,0px));padding:11px 18px;border-radius:12px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;line-height:1.45;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:toastIn 0.2s ease;max-width:92%;text-align:center;}
  .toast-warn{background:var(--warn);color:#2a0606;}
  @keyframes toastIn{from{transform:translateY(-14px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  /* ---------- Relatório ---------- */
  .report-sheet-wrap{background:#FFFFFF;color:#111;border-radius:10px;padding:18px 16px;font-family:var(--font);}

  .report-section-title{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#777;margin:18px 0 6px;font-weight:600;}
  .report-table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;font-variant-numeric:tabular-nums;}
  .report-table td{border-bottom:1px solid #DDD;padding:6px 3px;text-align:left;overflow-wrap:break-word;word-break:break-word;}
  .report-table .num{text-align:right;}

  .report-table .neg{color:#C22;}
  .report-chain{font-size:10px;color:#666;padding-left:8px;}
  .report-note{font-size:10.5px;color:#666;margin-top:14px;line-height:1.5;}

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

<script>

var NSH_CONFIG = {

};

function nshBoot() {
  'use strict';
  try {

  /* ================= constantes ================= */
  const LS_KEY = 'nsh_dashboard_v1';
  const LS_SESSION = 'nsh_sb_session';
  const PERIODS = {

  const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z"/></svg>';

  /* ================= estado da interface ================= */
  let state = null;
  let activeTab = 'dashboard';
  let stockView = 'stock', stockFilter = 'all', moveFilter = 'all', moveLimit = 40;
  let lastMoveType = 'sale';
  let editingProductId = null, editingFixedId = null, editingCollectionId = null;
  let confirmCallback = null, toastTimer = null;
  const mv = { priceTouched: false, costTouched: false, lastType: null, lastVid: null };
  const rs = { priceTouched: false };
  const sim = { period: 'monthly', customDays: 30, overrides: {} };

  /* ================= utilitários ================= */
  const byId = id => document.getElementById(id);
  const $all = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const genId = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function toNum(v) {
    let s = String(v == null ? '' : v).trim().replace(/\s/g, '');
    if (s.indexOf(',') > -1 && s.indexOf('.') > -1) s = s.replace(/\./g, '');
    s = s.replace(',', '.');
    const n = parseFloat(s);
    return isFinite(n) && n > 0 ? n : 0;
  }
  const toInt = v => Math.round(toNum(v));
  const round1 = n => Math.round(n * 10) / 10;
  const round2 = n => Math.round(n * 100) / 100;
  const plain = n => String(round2(n));
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  /* Valores guardados em euros; cada pessoa pode ver a app em EUR ou USD. */
  const LS_CUR = 'nsh_pref_cur', LS_FX = 'nsh_fx';
  let viewCur = lsGet(LS_CUR) === 'USD' ? 'USD' : 'EUR';
  let fx = { rate: 1.12, date: null, fetched: 0 };
  try { const c = JSON.parse(lsGet(LS_FX) || 'null'); if (c && c.rate > 0 && c.rate < 5) fx = c; } catch (e) {}
  function fmtUSD(n) {
    if (!isFinite(n)) n = 0;
    let v = viewCur === 'USD' ? n * fx.rate : n;
    const neg = v < -0.004; v = Math.abs(v);
    if (viewCur === 'USD') return (neg ? '−' : '') + '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (neg ? '−' : '') + v.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }
  const fxText = () => '1 € = ' + fx.rate.toLocaleString('pt-PT', { minimumFractionDigits: 4, maximumFractionDigits: 4 }) + ' $' + (fx.date ? ' (BCE, ' + fmtDate(fx.date) + ')' : ' (valor de referência)');
  async function loadFx() {
    if (fx.fetched && Date.now() - fx.fetched < 6 * 3600 * 1000) return;
    const get = async (u, pick) => {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
      try { const r = await fetch(u, { signal: ctl.signal }); if (!r.ok) return null; return pick(await r.json()); }
      catch (e) { return null; } finally { clearTimeout(t); }
    };
    let res = await get('https://api.frankfurter.dev/v2/rate/eur/usd', j => ({ rate: Number(j.rate), date: j.date }));
    if (!res || !(res.rate > 0)) res = await get('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD', j => ({ rate: Number(j.rates && j.rates.USD), date: j.date }));
    if (res && res.rate > 0 && res.rate < 5) {
      fx = { rate: res.rate, date: res.date || null, fetched: Date.now() };
      lsSet(LS_FX, JSON.stringify(fx));
      if (viewCur === 'USD') scheduleRender();
    }
  }
  function fmtPct(n) {
    if (!isFinite(n)) n = 0;
    return n.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
  }
  const fmtSigned = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);
  const setText = (id, t) => { const el = byId(id); if (el) el.textContent = t; };
  const getVal = id => { const el = byId(id); return el ? el.value : ''; };
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const cardTitle = t => '<h2 class="card-title">' + SPARK + t + '</h2>';
  const emptyState = msg => '<div class="empty-state">' + esc(msg) + '</div>';
  function opts(obj, sel) {
    return Object.keys(obj).map(k => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + esc(typeof obj[k] === 'string' ? obj[k] : obj[k].label) + '</option>').join('');
  }

  function isoDate(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  const todayISO = () => isoDate(new Date());
  function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return isoDate(d); }
  function parseISO(s) { const p = String(s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
  function daysSince(s) { const d = parseISO(s); if (!d) return 0; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((t - d) / 86400000); }
  function fmtDate(s) {
    const d = parseISO(s); if (!d || isNaN(d)) return '—';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  }
  function agoText(s) {
    const n = daysSince(s);
    if (n === 0) return 'hoje';
    if (n < 0) return 'daqui a ' + plural(-n, 'dia', 'dias');
    return 'há ' + plural(n, 'dia', 'dias');
  }
  const parseList = s => String(s || '').split(',').map(x => x.trim()).filter((x, i, a) => x && a.indexOf(x) === i);

  /* ================= dados de exemplo ================= */
  function defaultState() {
    const collections = [
      { id: 'col_base', name: 'Coleção Base', date: daysAgoISO(75) },
      { id: 'col_drop1', name: 'Drop 01 · Outono', date: daysAgoISO(21) }
    ];
    function mk(id, name, sku, col, price, ws, monthly, sizes, colors, costs) {
      const p = { id, name, sku, collectionId: col, price, wsPrice: ws, monthlySales: monthly, minStock: 2, sizes, colors,
        costs: costs.map((c, i) => ({ id: 'c' + (i + 1), label: c[0], value: c[1] })), variants: [] };
      (sizes.length ? sizes : ['Único']).forEach(s => (colors.length ? colors : ['']).forEach(c => {
        p.variants.push({ id: id + '_' + (s + c).replace(/[^A-Za-z0-9]/g, ''), size: s, color: c });

    const hd = mk('prod_1', 'Hoodie NSH Classic', 'NSH-HD-01', 'col_base', 65, 37, 25, ['S', 'M', 'L', 'XL'], ['Preto'],

    const sale = (p, s, c, qty, ch, d) => add('sale', p, s, c, qty, d, { channel: ch, unitPrice: ch === 'revenda' ? p.wsPrice : p.price });

    [['S', 4], ['M', 8], ['L', 8], ['XL', 4]].forEach(x => entry(cg, x[0], 'Preto', x[1], 21, 35));

    sale(hd, 'S', 'Preto', 2, 'loja', 70); sale(hd, 'S', 'Preto', 2, 'online', 50); sale(hd, 'S', 'Preto', 1, 'online', 12);
    sale(hd, 'M', 'Preto', 4, 'loja', 68); sale(hd, 'M', 'Preto', 3, 'online', 55); sale(hd, 'M', 'Preto', 4, 'revenda', 40);
    sale(hd, 'M', 'Preto', 2, 'online', 18); sale(hd, 'M', 'Preto', 1, 'site', 6);
    sale(hd, 'L', 'Preto', 3, 'online', 60); sale(hd, 'L', 'Preto', 4, 'revenda', 40); sale(hd, 'L', 'Preto', 2, 'loja', 25); sale(hd, 'L', 'Preto', 2, 'online', 9);
    sale(hd, 'XL', 'Preto', 2, 'online', 45); sale(hd, 'XL', 'Preto', 1, 'loja', 15);
    sale(ts, 'S', 'Preto', 3, 'online', 65); sale(ts, 'S', 'Preto', 2, 'loja', 20);

    sale(ts, 'XL', 'Preto', 2, 'online', 30);
    sale(ts, 'S', 'Branco', 1, 'online', 33); sale(ts, 'M', 'Branco', 3, 'loja', 44); sale(ts, 'M', 'Branco', 2, 'online', 8); sale(ts, 'L', 'Branco', 2, 'online', 27);
    sale(bn, 'Único', 'Preto', 4, 'online', 18); sale(bn, 'Único', 'Preto', 3, 'loja', 11); sale(bn, 'Único', 'Preto', 2, 'online', 3);
    sale(bn, 'Único', 'Bege', 2, 'online', 14);
    sale(cg, 'S', 'Preto', 1, 'online', 10); sale(cg, 'M', 'Preto', 3, 'online', 15); sale(cg, 'M', 'Preto', 1, 'loja', 5); sale(cg, 'L', 'Preto', 2, 'site', 12);
    add('return', hd, 'L', 'Preto', 1, 8, { unitPrice: 65, note: 'Troca de tamanho' });
    add('sample', cg, 'M', 'Preto', 1, 19, { note: 'Influencer' });

    const reservations = [
      { id: 'r1', kind: 'preenc', customer: 'Pré-venda Drop 02 · Instagram', productId: hd.id, variantId: vid(hd, 'M', 'Preto'), qty: 6, unitPrice: 65, date: daysAgoISO(5), status: 'open', note: '' },
      { id: 'r2', kind: 'revenda', customer: 'Parceiro Exemplo', productId: ts.id, variantId: vid(ts, 'L', 'Preto'), qty: 2, unitPrice: 21, date: daysAgoISO(3), status: 'open', note: 'Lote mínimo da 2.ª encomenda' },
      { id: 'r3', kind: 'revenda', customer: 'Parceiro Exemplo', productId: cg.id, variantId: vid(cg, 'L', 'Preto'), qty: 3, unitPrice: 43, date: daysAgoISO(3), status: 'open', note: '' },
      { id: 'r4', kind: 'preenc', customer: 'Cliente Instagram', productId: bn.id, variantId: vid(bn, 'Único', 'Bege'), qty: 2, unitPrice: 25, date: daysAgoISO(2), status: 'open', note: '' }

    return {

      fixedCosts: [
        { id: 'f1', label: 'Estúdio / Armazém', value: 150, period: 'monthly' },
        { id: 'f2', label: 'Marketing', value: 100, period: 'monthly' }
      ],
      lastPeriod: 'monthly', wholesaleShare: 20
    };
  }

  /* ================= migração e validação ================= */
  function normalizeState(raw) {
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.products)) return defaultState();
    const st = {
      version: 2, products: [],
      collections: Array.isArray(raw.collections) ? raw.collections.filter(c => c && c.id) : [],
      movements: Array.isArray(raw.movements) ? raw.movements.filter(m => m && m.id && MOVE_TYPES[m.type]) : [],
      reservations: Array.isArray(raw.reservations) ? raw.reservations.filter(r => r && r.id) : [],

      if (!p || !p.id) return;
      const costs = Array.isArray(p.costs) ? p.costs.map(c => ({ id: c.id || genId('c'), label: c.label || 'Custo', value: toNum(c.value) })) : [];
      const cost = costs.reduce((s, c) => s + c.value, 0);
      const q = {
        id: p.id, name: p.name || 'Produto', sku: p.sku || '', collectionId: p.collectionId || '',
        price: toNum(p.price), wsPrice: p.wsPrice != null ? toNum(p.wsPrice) : round2(cost * 1.23),
        monthlySales: toNum(p.monthlySales), minStock: p.minStock != null ? toInt(p.minStock) : 2,

  /* ================= persistência ================= */
  const cfg = (typeof NSH_CONFIG !== 'undefined' && NSH_CONFIG) || {};

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }

  /* ---- Supabase: sessão ---- */
  const sbBase = () => String(cfg.SUPABASE_URL).replace(/\/+$/, '');
  async function sbAuth(grant, body) {
    const r = await fetch(sbBase() + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST', headers: { 'apikey': cfg.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body)

    if (!r.ok) { const e = new Error('auth ' + r.status); e.status = r.status; throw e; }

  async function sbToken(force) {

      catch (e) {

  }

      method,
      headers: Object.assign({ 'apikey': cfg.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }, prefer ? { 'Prefer': prefer } : {}),
      body: body === undefined ? undefined : JSON.stringify(body)

    if (!tok) { if (!session) throw authErr(); throw new Error('offline'); }
    let r = await call(tok);
    if (r.status === 401) {
      tok = await sbToken(true);
      if (!tok) { if (!session) throw authErr(); throw new Error('offline'); }
      r = await call(tok);
      if (r.status === 401) { session = null; lsDel(LS_SESSION); throw authErr(); }
    }
    if (!r.ok) { const e = new Error('rest ' + r.status); e.status = r.status; try { e.body = await r.text(); } catch (x) {} throw e; }
    const t = await r.text();

  /* ---- Supabase: dados ----
     nsh_catalog       1 linha (produtos, coleções, custos fixos), com número de versão
     nsh_movements     1 linha por movimento (nunca se apaga: "deleted" = true)

  const MOVE_COLS = 'id,data,deleted,updated_at';
  const RES_COLS = 'id,data,status,deleted,updated_at';
  const cloud = { catalog: null, catVersion: 0, moves: new Map(), res: new Map(), movesTs: null, resTs: null, timer: null, inflight: null, lastSync: null };
  const emptyCatalog = () => ({ version: 2, products: [], collections: [], fixedCosts: [], wholesaleShare: 0 });
  function catalogFrom(st) { return { version: 2, products: clone(st.products), collections: clone(st.collections), fixedCosts: clone(st.fixedCosts), wholesaleShare: st.wholesaleShare }; }
  function fixCatalog(c) {
    const d = (c && typeof c === 'object') ? c : emptyCatalog();

    return d;
  }
  function rebuildFromCloud() {
    state = normalizeState(Object.assign({}, clone(fixCatalog(cloud.catalog)), {
      movements: Array.from(cloud.moves.values()), reservations: Array.from(cloud.res.values()), lastPeriod: lsGet(LS_PERIOD) || 'monthly'
    }));
  }
  async function pullCatalog(force) {
    const rows = await rest('GET', 'nsh_catalog?id=eq.main&select=version' + (force ? ',data' : ''));
    if (!rows || !rows.length) {
      const seed = catalogFrom(defaultState());
      try { await rest('POST', 'nsh_catalog', { id: 'main', data: seed, version: 1 }, 'return=minimal'); }
      catch (e) { if (e.status === 409) return pullCatalog(true); throw e; }
      cloud.catalog = seed; cloud.catVersion = 1; return true;
    }
    if (!force) { if (rows[0].version === cloud.catVersion && cloud.catalog) return false; return pullCatalog(true); }
    cloud.catalog = fixCatalog(rows[0].data); cloud.catVersion = rows[0].version; return true;
  }
  async function pullTable(table, cols, sinceTs, map) {
    let offset = 0, maxTs = sinceTs, changed = false;
    for (;;) {
      let q = table + '?select=' + cols + '&order=updated_at.asc,id.asc&limit=1000&offset=' + offset;
      if (sinceTs) q += '&updated_at=gte.' + encodeURIComponent(new Date(parseTs(sinceTs) - 60000).toISOString());
      else q += '&deleted=is.false';
      const rows = (await rest('GET', q)) || [];
      rows.forEach(row => {
        if (!maxTs || parseTs(row.updated_at) > parseTs(maxTs)) maxTs = row.updated_at;
        if (row.deleted) { if (map.delete(row.id)) changed = true; return; }
        const d = Object.assign({}, row.data || {}, { id: row.id });
        if (row.status) d.status = row.status;
        const old = map.get(row.id);
        if (!old || stableStr(old) !== stableStr(d)) { map.set(row.id, d); changed = true; }
      });
      if (rows.length < 1000) break;

  function syncNow(full) {

      try {
        if (full) { cloud.moves = new Map(); cloud.res = new Map(); cloud.movesTs = null; cloud.resTs = null; }
        const c = await pullCatalog(!!full);
        const a = await pullTable('nsh_movements', MOVE_COLS, cloud.movesTs, cloud.moves);
        const b = await pullTable('nsh_reservations', RES_COLS, cloud.resTs, cloud.res);
        cloud.movesTs = a.maxTs; cloud.resTs = b.maxTs; cloud.lastSync = new Date();

    })();

  }
  async function catalogMutate(fn) {
    for (let i = 0; i < 6; i++) {
      const rows = await rest('GET', 'nsh_catalog?id=eq.main&select=data,version');
      if (!rows || !rows.length) {
        const data = emptyCatalog(); fn(data);
        try { await rest('POST', 'nsh_catalog', { id: 'main', data, version: 1 }, 'return=minimal'); cloud.catalog = data; cloud.catVersion = 1; return; }
        catch (e) { if (e.status === 409) continue; throw e; }
      }
      const cur = rows[0], data = fixCatalog(clone(cur.data));
      fn(data);
      const out = await rest('PATCH', 'nsh_catalog?id=eq.main&version=eq.' + cur.version, { data, version: cur.version + 1 }, 'return=representation');
      if (Array.isArray(out) && out.length) { cloud.catalog = data; cloud.catVersion = cur.version + 1; return; }

  }
  async function upsertRows(table, rows) {
    for (let i = 0; i < rows.length; i += 500) {

    }
  }
  const moveRow = m => ({ id: m.id, move_date: validDate(m.date), product_id: m.productId, variant_id: m.variantId, data: m, deleted: false });
  const resRow = r => ({ id: r.id, status: r.status || 'open', product_id: r.productId, data: r, deleted: false });
  const idList = ids => '(' + ids.map(encodeURIComponent).join(',') + ')';

  /* ---- alterações: aplicadas logo no ecrã e depois gravadas ----
     spec = { catalog: fn(catálogo), moves: {add, removeIds, removeProduct}, res: {add, update:[{id, patch}], removeProduct} } */
  function applyPatch(o, patch) { Object.keys(patch).forEach(k => { if (patch[k] === null) delete o[k]; else o[k] = patch[k]; }); }
  function applySpecLocal(spec) {
    if (spec.catalog) spec.catalog(state);
    const mvS = spec.moves || {}, rvS = spec.res || {};
    if (mvS.add) mvS.add.forEach(m => state.movements.push(m));
    if (mvS.removeIds) state.movements = state.movements.filter(m => mvS.removeIds.indexOf(m.id) === -1);
    if (mvS.removeProduct) state.movements = state.movements.filter(m => m.productId !== mvS.removeProduct);
    if (rvS.add) rvS.add.forEach(r => state.reservations.push(r));
    if (rvS.update) rvS.update.forEach(u => { const r = state.reservations.find(x => x.id === u.id); if (r) applyPatch(r, u.patch); });
    if (rvS.removeProduct) state.reservations = state.reservations.filter(r => r.productId !== rvS.removeProduct);
  }
  function applySpecCloud(spec) {
    if (spec.catalog) { cloud.catalog = fixCatalog(clone(cloud.catalog)); spec.catalog(cloud.catalog); }
    const mvS = spec.moves || {}, rvS = spec.res || {};
    if (mvS.add) mvS.add.forEach(m => cloud.moves.set(m.id, m));
    if (mvS.removeIds) mvS.removeIds.forEach(id => cloud.moves.delete(id));
    if (mvS.removeProduct) Array.from(cloud.moves.values()).forEach(m => { if (m.productId === mvS.removeProduct) cloud.moves.delete(m.id); });
    if (rvS.add) rvS.add.forEach(r => cloud.res.set(r.id, r));
    if (rvS.update) rvS.update.forEach(u => { const r = cloud.res.get(u.id); if (r) { const n = Object.assign({}, r); applyPatch(n, u.patch); cloud.res.set(u.id, n); } });
    if (rvS.removeProduct) Array.from(cloud.res.values()).forEach(r => { if (r.productId === rvS.removeProduct) cloud.res.delete(r.id); });
    rebuildFromCloud();
  }
  async function remoteSpec(spec) {
    const mvS = spec.moves || {}, rvS = spec.res || {};
    if (mvS.add && mvS.add.length) await upsertRows('nsh_movements', mvS.add.map(moveRow));
    if (mvS.removeIds && mvS.removeIds.length) await rest('PATCH', 'nsh_movements?id=in.' + idList(mvS.removeIds), { deleted: true }, 'return=minimal');
    if (mvS.removeProduct) await rest('PATCH', 'nsh_movements?product_id=eq.' + encodeURIComponent(mvS.removeProduct), { deleted: true }, 'return=minimal');
    if (rvS.add && rvS.add.length) await upsertRows('nsh_reservations', rvS.add.map(resRow));
    if (rvS.update) for (const u of rvS.update) { const r = cloud.res.get(u.id); if (r) await rest('PATCH', 'nsh_reservations?id=eq.' + encodeURIComponent(u.id), { status: r.status || 'open', data: r }, 'return=minimal'); }

  }
  async function commit(spec) {
    if (mode !== 'cloud') { applySpecLocal(spec); await saveState(); return true; }
    const snap = { catalog: clone(cloud.catalog), moves: new Map(cloud.moves), res: new Map(cloud.res) };
    applySpecCloud(spec);
    try {
      await remoteSpec(spec);
      rebuildFromCloud(); setChip(null); scheduleRender();
      return true;
    } catch (e) {
      cloud.catalog = snap.catalog; cloud.moves = snap.moves; cloud.res = snap.res; rebuildFromCloud();
      if (e && e.auth) { onSessionLost(); return false; }
      render(); setChip('Erro ao guardar');
      showToast('Sem ligação ao servidor: a alteração não foi guardada. Tenta de novo.', 'warn');
      syncNow().then(ch => { if (ch) scheduleRender(); }).catch(() => {});
      return false;
    }
  }
  async function replaceAllCloud(newState) {
    await rest('PATCH', 'nsh_movements?deleted=is.false', { deleted: true }, 'return=minimal');
    await rest('PATCH', 'nsh_reservations?deleted=is.false', { deleted: true }, 'return=minimal');
    await upsertRows('nsh_movements', newState.movements.map(moveRow));
    await upsertRows('nsh_reservations', newState.reservations.map(resRow));

    await syncNow(true);
  }
  async function freshForCheck() {
    if (mode !== 'cloud') return;
    try { if (await syncNow()) scheduleRender(); } catch (e) { if (e && e.auth) { onSessionLost(); throw e; } }
  }

  /* ---- sincronização automática ---- */
  function startPolling() {
    stopPolling();
    cloud.timer = setInterval(() => { if (!document.hidden) bgSync(); }, 20000);
  }
  function stopPolling() { if (cloud.timer) clearInterval(cloud.timer); cloud.timer = null; }
  async function bgSync() {
    if (mode !== 'cloud' || !session || !cloud.catalog) return;
    try { const ch = await syncNow(); setChip(null); if (ch) scheduleRender(); }
    catch (e) { if (e && e.auth) onSessionLost(); else setChip('Sem ligação'); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) bgSync(); });
  window.addEventListener('online', () => bgSync());
  let renderPending = false;
  const typing = () => { const a = document.activeElement, c = byId('app-content'); return !!(a && c && c.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
  function scheduleRender() { if (typing()) { renderPending = true; return; } renderPending = false; render(); }
  function onSessionLost() {
    stopPolling(); session = null; lsDel(LS_SESSION);
    cloud.catalog = null; cloud.moves = new Map(); cloud.res = new Map(); cloud.catVersion = 0; cloud.movesTs = null; cloud.resTs = null;
    state = defaultState(); closeModal(); render();
    showToast('A sessão terminou. Entra de novo.', 'warn');
  }
  async function cloudStart() {
    byId('app-content').innerHTML = '<div class="loading-state">A carregar os dados da NSH...</div>';
    try { await syncNow(true); setChip(null); }
    catch (e) {
      if (e && e.auth) { onSessionLost(); return; }

  }

  /* ---- modos sem nuvem (este dispositivo / memória da app) ---- */
  async function loadState() {
    try {
      let raw = null;
      if (mode === 'claude') { const res = await window.storage.get(LS_KEY, false); raw = res && res.value; }
      else raw = lsGet(LS_KEY);
      state = raw ? normalizeState(JSON.parse(raw)) : defaultState();
    } catch (e) { state = defaultState(); }
  }
  async function saveState() {
    if (mode === 'cloud') return;
    try {
      if (mode === 'claude') { const res = await window.storage.set(LS_KEY, JSON.stringify(state), false); if (!res) throw new Error('empty'); }
      else if (!lsSet(LS_KEY, JSON.stringify(state))) throw new Error('ls');

  }
  function setChip(text) {

  }
  const needsLogin = () => mode === 'cloud' && !session;
  const cloudDown = () => mode === 'cloud' && !!session && !cloud.catalog;

  /* ================= cálculos ================= */
  const findProduct = id => state.products.find(p => p.id === id) || null;

  const findVariant = (p, id) => (p ? p.variants.find(v => v.id === id) : null) || null;
  function variantLabel(v) {
    if (!v) return '—';
    const parts = [];
    if (v.size && v.size !== 'Único') parts.push(v.size);
    if (v.color) parts.push(v.color);
    return parts.length ? parts.join(' · ') : 'Único';
  }

  function computeStock() {
    const v = {};
    state.products.forEach(p => p.variants.forEach(x => { v[x.id] = { phys: 0, res: 0, avail: 0 }; }));
    state.movements.forEach(m => { if (v[m.variantId]) v[m.variantId].phys += signedQty(m); });
    state.reservations.forEach(r => { if (r.status === 'open' && v[r.variantId]) v[r.variantId].res += toInt(r.qty); });

  }

  function salesSince(days) {
    const from = daysAgoISO(days); let rev = 0, units = 0, cogs = 0; const byCh = {};

      const p = findProduct(m.productId); const q = toInt(m.qty); const sg = m.type === 'sale' ? 1 : -1;
      const val = q * toNum(m.unitPrice);

  function fixedCostMonthly(fc) {

  }
  function periodFactor() {
    if (sim.period === 'custom') return Math.max(1, toNum(sim.customDays)) / 30;
    return PERIODS[sim.period].factor;
  }
  function simulate() {
    const f = periodFactor(); let totalRevenue = 0, totalCost = 0;
    const rows = state.products.map(p => {
      const units = Object.prototype.hasOwnProperty.call(sim.overrides, p.id) ? toNum(sim.overrides[p.id]) : toNum(p.monthlySales) * f;
      const revenue = units * blendedPrice(p), cost = units * unitCost(p);
      totalRevenue += revenue; totalCost += cost;
      return { p, units, revenue, cost, profit: revenue - cost };
    });
    const grossProfit = totalRevenue - totalCost, fixedTotal = totalFixedMonthly() * f, netProfit = grossProfit - fixedTotal;
    return { rows, totalRevenue, totalCost, grossProfit, fixedTotal, netProfit,
      grossMarginPct: totalRevenue > 0 ? (grossProfit / totalRevenue) * 100 : 0,
      netMarginPct: totalRevenue > 0 ? (netProfit / totalRevenue) * 100 : 0 };
  }
  function barRow(label, value, max, cls) {
    const w = Math.min(100, (Math.abs(value) / (max || 1)) * 100);
    return '<div class="bar-row"><span class="bar-label">' + esc(label) + '</span><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + w.toFixed(1) + '%"></div></div><span class="bar-value">' + fmtUSD(value) + '</span></div>';
  }

  /* ================= ecrã: Painel ================= */
  function renderDashboard() {
    const S = computeStock(), E = estimateMonthly(), R = salesSince(30);
    let phys = 0, res = 0, stockCost = 0, stockSale = 0, outN = 0, lowN = 0, shortUnits = 0; const outNames = [];
    state.products.forEach(p => p.variants.forEach(v => {
      const s = S[v.id]; const ph = Math.max(0, s.phys);
      phys += ph; res += s.res; stockCost += ph * unitCost(p); stockSale += ph * toNum(p.price);
      if (s.avail < 0) shortUnits += -s.avail;
      if (v.archived && s.phys === 0 && s.res === 0) return;
      const st = variantStatus(p, s);
      if (st === 'out' || st === 'short') { outN++; if (outNames.length < 3) outNames.push(p.name + ' ' + variantLabel(v)); }
      else if (st === 'low') lowN++;
    }));
    const avail = phys - res;
    const n = state.products.length;
    const costed = state.products.filter(p => unitCost(p) > 0), nc = costed.length;
    const avgMargin = nc ? costed.reduce((s, p) => s + marginPct(p), 0) / nc : 0;
    const avgMarkup = nc ? costed.reduce((s, p) => s + markupPct(p), 0) / nc : 0;

    const gp = Math.max(0, Math.min(100, E.netPct)), glen = 251.3;
    const gauge = '<div class="card">' + cardTitle('Margem líquida estimada') +
      '<div class="gauge"><svg viewBox="0 0 200 108" aria-hidden="true"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#2A2A2D" stroke-width="14" stroke-linecap="round"/>' +
      '<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="' + (E.net < 0 ? '#F87171' : '#EE6331') + '" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + (glen * gp / 100).toFixed(1) + ' ' + glen + '"/></svg>' +
      '<div class="gauge-val"><strong class="num">' + fmtPct(E.netPct) + '</strong><span>de lucro sobre vendas</span></div></div>' +
      '<div class="gauge-scale"><span>0%</span><span>100%</span></div></div>';

    let tags = '';
    if (outN) tags += '<span class="tag tag-bad">' + plural(outN, 'variante sem stock', 'variantes sem stock') + '</span>';
    if (lowN) tags += '<span class="tag tag-warn">' + plural(lowN, 'variante com stock baixo', 'variantes com stock baixo') + '</span>';
    if (!outN && !lowN) tags = '<span class="tag tag-good">Sem alertas de stock</span>';
    const stockCard = '<div class="card">' + cardTitle('Stock agora') +
      '<div class="trio"><div><span>Físico</span><strong>' + phys + '</strong></div><div><span>Reservado</span><strong>' + res + '</strong></div>' +
      '<div><span>Disponível</span><strong class="' + (avail < 0 ? 'warn-text' : '') + '">' + avail + '</strong></div></div>' +
      '<div class="tags">' + tags + '</div>' +
      '<button class="btn-secondary wide-btn" data-action="goto" data-tab="stock">Ver stock por variante</button></div>';

    let salesCard = '<div class="card">' + cardTitle('Vendas registadas · 30 dias');
    if (!R.units && !R.rev) {
      salesCard += '<p class="tab-sub">Ainda não há vendas registadas nos últimos 30 dias. Regista-as no separador Stock.</p></div>';
    } else {
      const chMax = Math.max(1, ...Object.keys(R.byCh).map(k => R.byCh[k]));
      const chBars = Object.keys(CHANNELS).filter(k => R.byCh[k]).sort((a, b) => R.byCh[b] - R.byCh[a]).map(k => barRow(CHANNELS[k], R.byCh[k], chMax, 'profit')).join('');
      salesCard += '<div class="trio money"><div><span>Receita</span><strong>' + fmtUSD(R.rev) + '</strong></div><div><span>Peças</span><strong>' + R.units + '</strong></div>' +
        '<div><span>Lucro bruto</span><strong class="' + (R.gross < 0 ? 'warn-text' : 'good-text') + '">' + fmtUSD(R.gross) + '</strong></div></div>' +
        (chBars ? '<div class="section-label" style="margin:18px 0 12px">Vendas por canal</div><div class="bars">' + chBars + '</div>' : '') + '</div>';
    }

    const rows = E.rows.slice().sort((a, b) => b.profit - a.profit);
    const maxP = Math.max(1, ...rows.map(x => Math.abs(x.profit)));
    const profitBars = rows.map(x => barRow(x.p.name, x.profit, maxP, x.profit < 0 ? 'loss' : 'profit')).join('');

    const ins = [];
    const noCost = state.products.filter(p => unitCost(p) <= 0);
    if (noCost.length) ins.push(['warn', 'Sem custo preenchido: <b>' + noCost.map(p => esc(p.name)).join(', ') + '</b>. Até preencheres a cadeia de custos, a margem e o lucro destes produtos aparecem acima do real.']);
    if (rows.length && E.gross > 0 && rows[0].profit > 0) ins.push(['', '<b>' + esc(rows[0].p.name) + '</b> gera ' + fmtPct((rows[0].profit / E.gross) * 100) + ' do lucro bruto mensal estimado.']);
    if (shortUnits > 0) ins.push(['bad', 'Tens <b>' + plural(shortUnits, 'peça reservada', 'peças reservadas') + ' sem stock</b>: precisam de ser produzidas ou repostas.']);
    if (outNames.length) ins.push(['bad', 'Sem stock disponível: <b>' + outNames.map(esc).join(', ') + '</b>' + (outN > outNames.length ? ' e mais ' + (outN - outNames.length) : '') + '.']);
    let worstWs = null;
    state.products.forEach(p => { if (toNum(p.wsPrice) > 0 && (!worstWs || wsMarginPct(p) < wsMarginPct(worstWs))) worstWs = p; });
    if (worstWs && wsMarginPct(worstWs) < 15) ins.push(['warn', 'A margem de revenda de <b>' + esc(worstWs.name) + '</b> é de ' + fmtPct(wsMarginPct(worstWs)) + '. Confirma o preço de revenda.']);
    let worst = null;
    costed.forEach(p => { if (!worst || marginPct(p) < marginPct(worst)) worst = p; });
    if (worst && nc > 1) { const wm = marginPct(worst); ins.push([wm < 0 ? 'bad' : (wm < 30 ? 'warn' : ''), 'Menor margem na loja: <b>' + esc(worst.name) + '</b> com ' + fmtPct(wm) + (wm < 30 ? '. Vale a pena rever o preço ou os custos.' : '.')]); }
    if (E.breakEven !== null) ins.push([E.units >= E.breakEven ? '' : 'bad', 'Para cobrir os custos fixos precisas de cerca de <b>' + plural(Math.ceil(E.breakEven), 'peça', 'peças') + '/mês</b>; a tua estimativa atual é de ' + Math.round(E.units) + '.']);
    const insights = ins.length ? '<div class="card">' + cardTitle('Análise automática') + ins.slice(0, 5).map(i => '<div class="insight ' + i[0] + '"><i></i><div>' + i[1] + '</div></div>').join('') + '</div>' : '';

    return '<div class="stack">' +
      '<div class="card hero"><div class="hero-main"><span class="hero-brand">NO SAFETY HOOD · ' + viewCur + '</span>' +
        '<div class="hero-label">Lucro líquido estimado por mês</div>' +
        '<div class="hero-big ' + (E.net < 0 ? 'warn-text' : '') + '">' + fmtUSD(E.net) + '</div>' +
        '<span class="pill-badge ' + (E.net < 0 ? 'neg' : '') + '">' + fmtPct(E.netPct) + ' de margem líquida</span></div>' +
        '<div class="hero-split"><div><span>Receita</span><strong>' + fmtUSD(E.rev) + '</strong></div><div><span>Custos</span><strong>' + fmtUSD(E.cost) + '</strong></div><div><span>Fixos</span><strong>' + fmtUSD(E.fixed) + '</strong></div></div></div>' +
      stockCard + salesCard + gauge +
      '<div class="stat-grid">' +
        '<div class="card stat-card"><span>Stock (custo)</span><strong>' + fmtUSD(stockCost) + '</strong></div>' +
        '<div class="card stat-card"><span>Potencial de venda</span><strong class="good-text">' + fmtUSD(stockSale) + '</strong></div>' +
        '<div class="card stat-card"><span>Markup médio (loja)</span><strong>' + fmtPct(avgMarkup) + '</strong></div>' +
        '<div class="card stat-card"><span>Margem média (loja)</span><strong>' + fmtPct(avgMargin) + '</strong></div>' +
      '</div>' +
      (profitBars ? '<div class="card">' + cardTitle('Lucro estimado por produto · mês') + '<div class="bars">' + profitBars + '</div></div>' : '') +
      insights + '</div>' +
      '<p class="hint">As estimativas usam as vendas mensais de cada produto e o peso da revenda definido na Simulação (' + fmtPct(shareFrac() * 100) + ').</p>';
  }

  /* ================= ecrã: Produtos ================= */
  function renderProducts() {
    const S = computeStock();
    const cards = state.products.map(p => {
      const cost = unitCost(p), m = marginPct(p), tot = productStock(p, S);
      let out = 0, low = 0;

      const col = findCollection(p.collectionId);
      const health = toNum(p.price) - cost < 0 ? 'h-bad' : (m < 20 ? 'h-warn' : 'h-good');
      let tags = '';
      if (col) tags += '<span class="tag tag-brand">' + esc(col.name) + '</span>';
      if (out) tags += '<span class="tag tag-bad">' + plural(out, 'variante sem stock', 'variantes sem stock') + '</span>';
      if (low) tags += '<span class="tag tag-warn">' + plural(low, 'variante com stock baixo', 'variantes com stock baixo') + '</span>';
      return '<button type="button" class="card product-card ' + health + '" data-action="edit-product" data-id="' + p.id + '">' +
        '<div class="pc-top"><div><div class="product-name">' + esc(p.name) + '</div>' + (p.sku ? '<div class="product-sku">' + esc(p.sku) + '</div>' : '') + '</div>' +
        '<div class="pc-price"><strong>' + fmtUSD(toNum(p.price)) + '</strong><span>Revenda ' + (toNum(p.wsPrice) > 0 ? fmtUSD(toNum(p.wsPrice)) : '—') + '</span></div></div>' +
        '<div class="mini-row"><div class="mini-stat"><span>Custo</span><strong>' + fmtUSD(cost) + '</strong></div>' +
        '<div class="mini-stat"><span>Margem</span><strong>' + fmtPct(m) + '</strong></div>' +
        '<div class="mini-stat"><span>Revenda</span><strong>' + (toNum(p.wsPrice) > 0 ? fmtPct(wsMarginPct(p)) : '—') + '</strong></div>' +
        '<div class="mini-stat"><span>Disponível</span><strong class="' + (tot.avail < 0 ? 'warn-text' : '') + '">' + tot.avail + '</strong></div></div>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') + '</button>';
    }).join('');
    return '<div class="intro"><p class="tab-sub">' + plural(state.products.length, 'produto', 'produtos') + '. Toca num produto para editar preços, variantes e custos.</p></div>' +
      '<div class="stack">' + (cards || emptyState('Ainda não tens produtos. Adiciona o primeiro.')) + '</div>' +
      '<button class="btn-add" data-action="add-product">+ Adicionar produto</button>';
  }

  /* ================= ecrã: Stock ================= */
  function renderStock() {
    const S = computeStock();
    const openRes = state.reservations.filter(r => r.status === 'open').length;
    const seg = '<div class="seg">' +
      '<button class="seg-btn ' + (stockView === 'stock' ? 'on' : '') + '" data-action="stock-view" data-view="stock">Stock</button>' +
      '<button class="seg-btn ' + (stockView === 'moves' ? 'on' : '') + '" data-action="stock-view" data-view="moves">Movimentos</button>' +
      '<button class="seg-btn ' + (stockView === 'res' ? 'on' : '') + '" data-action="stock-view" data-view="res">Reservas' + (openRes ? '<span class="seg-badge">' + openRes + '</span>' : '') + '</button></div>';
    const actions = '<div class="btn-row" style="margin:0 0 16px"><button class="btn-primary" data-action="new-move">Registar movimento</button><button class="btn-secondary" data-action="new-res">Nova reserva</button></div>';
    if (!state.products.length) return seg + emptyState('Adiciona primeiro um produto no separador Produtos.');
    let body = '';
    if (stockView === 'moves') body = renderMoves();
    else if (stockView === 'res') body = renderReservations(S);
    else body = renderStockGrid(S);
    return seg + actions + body;
  }

  function renderStockGrid(S) {
    const pills = '<div class="pill-row"><button class="pill ' + (stockFilter === 'all' ? 'on' : '') + '" data-action="stock-filter" data-f="all">Todas as variantes</button>' +
      '<button class="pill ' + (stockFilter === 'alerts' ? 'on' : '') + '" data-action="stock-filter" data-f="alerts">Só alertas</button></div>';
    const cards = state.products.map(p => {
      let vs = visibleVariants(p, S);
      if (stockFilter === 'alerts') vs = vs.filter(v => variantStatus(p, S[v.id]) !== 'ok');
      if (!vs.length) return '';
      const tot = productStock(p, S);
      const rowsHtml = vs.map(v => {
        const s = S[v.id] || blank, st = variantStatus(p, s);
        const label = variantLabel(v) + (v.archived ? ' (arquivada)' : '');
        return '<button class="vgrid vrow st-' + st + '" data-action="move-variant" data-pid="' + p.id + '" data-vid="' + v.id + '">' +
          '<span class="vname"><i></i><em>' + esc(label) + '</em></span><span>' + s.phys + '</span><span class="vres">' + (s.res || '—') + '</span><span class="vav">' + fmtSigned(s.avail).replace('+', '') + '</span></button>';
      }).join('');
      return '<div class="card"><div class="stock-head"><div><div class="product-name">' + esc(p.name) + '</div>' + (p.sku ? '<div class="product-sku">' + esc(p.sku) + '</div>' : '') + '</div>' +
        '<div class="stock-tot"><strong class="' + (tot.avail < 0 ? 'warn-text' : '') + '">' + tot.avail + '</strong><span>disponíveis</span></div></div>' +
        '<div class="vgrid vgrid-head"><span>Variante</span><span>Físico</span><span>Res.</span><span>Disp.</span></div>' + rowsHtml + '</div>';
    }).join('');
    return pills + '<div class="stack">' + (cards || emptyState('Nenhuma variante com alertas. Está tudo com stock suficiente.')) + '</div>' +
      '<p class="hint">Disponível = físico − reservado. Toca numa variante para registar um movimento. O alerta de stock baixo define-se em cada produto.</p>';
  }

  function renderMoves() {
    const groups = { all: null, in: ['in'], sale: ['sale'], return: ['return'], other: ['sample', 'loss', 'adjust'] };
    const labels = { all: 'Todos', in: 'Entradas', sale: 'Vendas', return: 'Devoluções', other: 'Outros' };
    const pills = '<div class="pill-row">' + Object.keys(groups).map(k => '<button class="pill ' + (moveFilter === k ? 'on' : '') + '" data-action="move-filter" data-f="' + k + '">' + labels[k] + '</button>').join('') + '</div>';
    const g = groups[moveFilter];
    const list = state.movements.map((m, i) => ({ m, i })).filter(x => !g || g.indexOf(x.m.type) > -1)
      .sort((a, b) => (a.m.date < b.m.date ? 1 : a.m.date > b.m.date ? -1 : b.i - a.i));
    if (!list.length) return pills + emptyState('Ainda não há movimentos deste tipo.');
    const rows = list.slice(0, moveLimit).map(x => {
      const m = x.m, p = findProduct(m.productId), v = findVariant(p, m.variantId), q = signedQty(m);
      let sub = MOVE_TYPES[m.type].label;
      if (m.type === 'sale' && m.channel) sub += ' · ' + (CHANNELS[m.channel] || m.channel);
      sub += ' · ' + fmtDate(m.date);
      if (m.note) sub += ' · ' + m.note;
      let val = '';
      if (m.type === 'sale') val = fmtUSD(toInt(m.qty) * toNum(m.unitPrice));
      else if (m.type === 'return' && toNum(m.unitPrice) > 0) val = fmtUSD(-toInt(m.qty) * toNum(m.unitPrice));
      else if (m.type === 'in' && toNum(m.unitCost) > 0) val = 'custo ' + fmtUSD(toInt(m.qty) * toNum(m.unitCost));
      return '<button class="move-row" data-action="del-move" data-id="' + m.id + '"><div class="move-main"><div class="move-title">' + esc((p ? p.name : 'Produto removido') + ' · ' + variantLabel(v)) + '</div>' +
        '<div class="move-sub">' + esc(sub) + '</div></div><div class="move-qty ' + (q > 0 ? 'pos' : '') + '">' + fmtSigned(q) + (val ? '<small>' + val + '</small>' : '') + '</div></button>';
    }).join('');
    return pills + '<div class="list">' + rows + '</div>' +
      (list.length > moveLimit ? '<button class="btn-ghost wide-btn" data-action="more-moves">Ver mais (' + (list.length - moveLimit) + ')</button>' : '') +
      '<p class="hint">Toca num movimento para o apagar. O stock é sempre a soma dos movimentos.</p>';
  }

  function renderReservations(S) {
    const open = state.reservations.filter(r => r.status === 'open').sort((a, b) => (a.date > b.date ? 1 : -1));
    const closed = state.reservations.filter(r => r.status !== 'open').sort((a, b) => ((b.closedAt || b.date) > (a.closedAt || a.date) ? 1 : -1)).slice(0, 15);
    const openHtml = open.map(r => {
      const p = findProduct(r.productId), v = findVariant(p, r.variantId), s = S[r.variantId] || blank;
      const ready = s.phys >= toInt(r.qty);
      return '<div class="card"><div class="res-top"><div><div class="product-name">' + esc(r.customer) + '</div><div class="move-sub">' + esc(RES_KINDS[r.kind] || 'Reserva') + ' · ' + fmtDate(r.date) + '</div></div>' +
        '<span class="tag ' + (ready ? 'tag-good' : 'tag-bad') + '">' + (ready ? 'Pronta a entregar' : 'Por produzir') + '</span></div>' +
        '<div class="res-line"><span>' + toInt(r.qty) + ' × ' + esc((p ? p.name : '—') + ' · ' + variantLabel(v)) + '</span><strong>' + fmtUSD(toInt(r.qty) * toNum(r.unitPrice)) + '</strong></div>' +
        (r.note ? '<div class="res-note">' + esc(r.note) + '</div>' : '') +
        '<div class="btn-row"><button class="btn-secondary" data-action="cancel-res" data-id="' + r.id + '">Cancelar</button><button class="btn-primary ' + (ready ? '' : 'is-off') + '" data-action="deliver-res" data-id="' + r.id + '">Entregar</button></div></div>';
    }).join('');
    const closedHtml = closed.map(r => {
      const p = findProduct(r.productId), v = findVariant(p, r.variantId);
      return '<div class="closed-row"><div><b>' + esc(r.customer) + '</b><br>' + toInt(r.qty) + ' × ' + esc((p ? p.name : '—') + ' · ' + variantLabel(v)) + '</div><span>' + (r.status === 'done' ? 'Entregue ' + fmtDate(r.closedAt || r.date) : 'Cancelada') + '</span></div>';
    }).join('');
    return '<div class="stack">' + (openHtml || emptyState('Não há reservas em aberto. Usa "Nova reserva" para pré-encomendas e lotes de revenda.')) + '</div>' +
      (closedHtml ? '<div class="section-label">Entregues e canceladas</div>' + closedHtml : '') +
      '<p class="hint">As reservas tiram peças ao stock disponível sem mexer no físico. Podes reservar mesmo sem stock: a diferença fica "por produzir".</p>';
  }

  /* ================= ecrã: Simulação ================= */
  function barsHtml(result) {
    const max = Math.max(result.totalRevenue, result.totalCost, Math.abs(result.netProfit), 1);
    return barRow('Receita', result.totalRevenue, max, '') + barRow('Custos', result.totalCost, max, 'cost') + barRow('Lucro líquido', result.netProfit, max, result.netProfit < 0 ? 'loss' : 'profit');
  }
  function renderSim() {
    const result = simulate();
    const pills = Object.keys(PERIODS).map(k => '<button class="pill ' + (sim.period === k ? 'on' : '') + '" data-action="set-period" data-period="' + k + '">' + PERIODS[k].label + '</button>').join('');
    const customRow = sim.period === 'custom' ? '<label><span class="label-text">Número de dias</span><input type="text" id="custom-days-input" inputmode="numeric" pattern="[0-9]*" value="' + esc(sim.customDays) + '"></label>' : '';
    const rows = result.rows.map(r =>
      '<div class="card"><div class="sim-row-name">' + esc(r.p.name) + '</div>' +

      '<div class="sim-figs"><span>Receita<strong id="sim-rev-' + r.p.id + '">' + fmtUSD(r.revenue) + '</strong></span><span>Custo<strong id="sim-cost-' + r.p.id + '">' + fmtUSD(r.cost) + '</strong></span>' +
      '<span>Lucro<strong class="' + (r.profit < 0 ? 'warn-text' : '') + '" id="sim-profit-' + r.p.id + '">' + fmtUSD(r.profit) + '</strong></span></div></div>').join('');
    return '<div class="intro"><p class="tab-sub">Receita e lucro estimados para o período escolhido.</p></div>' +
      '<div class="pill-row">' + pills + '</div>' + customRow +
      '<div class="card" style="margin-bottom:12px"><div class="share-row"><div><div class="share-title">Peso da revenda</div><div class="hint" style="margin-top:2px">Parte das peças vendidas a preço de revenda.</div></div>' +
      '<div class="share-input"><input type="text" id="share-input" inputmode="decimal" value="' + esc(plain(toNum(state.wholesaleShare))) + '"><span>%</span></div></div></div>' +
      '<div class="stack">' + (rows || emptyState('Adiciona produtos para simular receita e lucro.')) + '</div>' +
      (result.rows.length ? '<button class="btn-ghost wide-btn" data-action="reset-sim">Repor valores da base mensal</button>' : '') +
      '<div class="stack" style="margin-top:14px"><div class="card kv-card">' +
        '<div class="kv"><span>Receita total</span><strong id="sim-total-revenue">' + fmtUSD(result.totalRevenue) + '</strong></div>' +

  function saveProductFromModal() {
    const name = getVal('f-name').trim();
    if (!name) { showToast('Indica um nome para o produto.', 'warn'); const el = byId('f-name'); if (el) el.focus(); return; }
    const existing = editingProductId ? findProduct(editingProductId) : null;
    const sizes = parseList(getVal('f-sizes')), colors = parseList(getVal('f-colors'));
    const ss = sizes.length ? sizes : ['Único'], cc = colors.length ? colors : [''];
    const old = existing ? existing.variants : [];
    const S = computeStock();
    const next = [];
    ss.forEach(s => cc.forEach(c => {
      const ex = old.find(v => v.size === s && v.color === c);
      if (ex) { delete ex.archived; next.push(ex); } else next.push({ id: genId('v'), size: s, color: c });
    }));
    const removed = old.filter(v => next.indexOf(v) === -1);
    for (const v of removed) {
      const s = S[v.id] || blank;
      if (s.res > 0) { showToast('Não podes remover a variante ' + variantLabel(v) + ': tem reservas em aberto.', 'warn'); return; }
      if (s.phys !== 0) { showToast('Não podes remover a variante ' + variantLabel(v) + ': ainda tem ' + plural(s.phys, 'peça', 'peças') + ' em stock. Regista um ajuste de contagem para 0 antes de a remover.', 'warn'); return; }
    }
    const keep = removed.filter(v => state.movements.some(m => m.variantId === v.id) || state.reservations.some(r => r.variantId === v.id));
    keep.forEach(v => { v.archived = true; });
    const costs = readCostRows().map(c => ({ id: c.id, label: (c.label || '').trim() || 'Custo', value: toNum(c.value) })).filter(c => c.label !== 'Custo' || c.value > 0);
    const data = {
      name, sku: getVal('f-sku').trim(), collectionId: getVal('f-col'), price: toNum(getVal('f-price')), wsPrice: toNum(getVal('f-ws')),
      monthlySales: toNum(getVal('f-monthly')), minStock: toInt(getVal('f-min')), sizes: ss, colors: cc.filter(Boolean),
      costs: costs.length ? costs : [{ id: genId('c'), label: 'Custo', value: 0 }], variants: next.concat(keep)
    };
    const prod = clone(Object.assign({ id: existing ? existing.id : genId('prod') }, data));
    commit({ catalog: c => { const i = c.products.findIndex(x => x.id === prod.id); if (i > -1) c.products[i] = clone(prod); else c.products.push(clone(prod)); } });
    closeModal(); render();
    showToast(keep.length ? 'Produto guardado. Variantes com histórico ficaram arquivadas.' : 'Produto guardado.');
  }

  function syncMove() {
    const type = getVal('mv-type'), p = findProduct(getVal('mv-prod')); if (!p) return;
    const vid = getVal('mv-var'), s = computeStock()[vid] || blank;
    byId('mv-ch-wrap').hidden = type !== 'sale';
    byId('mv-price-wrap').hidden = !(type === 'sale' || type === 'return');
    byId('mv-cost-wrap').hidden = type !== 'in';
    setText('mv-qty-wrap-label', type === 'adjust' ? 'Contagem real (peças)' : 'Quantidade');
    setText('mv-price-wrap-label', type === 'return' ? 'Valor reembolsado por peça (EUR)' : 'Preço por peça (EUR)');
    if (!mv.priceTouched) byId('mv-price').value = plain(priceFor(p, type === 'sale' ? getVal('mv-ch') : 'loja'));
    if (!mv.costTouched) byId('mv-cost').value = plain(unitCost(p));
    const q = byId('mv-qty');
    if (type === 'adjust' && (mv.lastType !== 'adjust' || mv.lastVid !== vid)) q.value = String(Math.max(0, s.phys));
    else if (type !== 'adjust' && mv.lastType === 'adjust') q.value = '1';
    mv.lastType = type; mv.lastVid = vid;
    byId('mv-info').innerHTML = 'No sistema: <strong>' + s.phys + '</strong> físico · <strong>' + s.res + '</strong> reservado · <strong class="' + (s.avail < 0 ? 'warn-text' : '') + '">' + s.avail + '</strong> disponível' +
      (type === 'adjust' ? '<br>Indica quantas peças contaste. A diferença é registada automaticamente.' : '');
  }
  let busy = false;
  async function guarded(btn, fn) {
    if (busy) return; busy = true; if (btn) btn.disabled = true;
    try { await fn(); } finally { busy = false; if (btn && document.body.contains(btn)) btn.disabled = false; }
  }
  async function saveMove() {
    const type = getVal('mv-type');
    if (type !== 'in' && type !== 'return') { try { await freshForCheck(); } catch (e) { return; } }
    const p = findProduct(getVal('mv-prod')), v = findVariant(p, getVal('mv-var'));
    if (!p || !v) { showToast('Escolhe o produto e a variante.', 'warn'); return; }
    const s = computeStock()[v.id] || blank;
    const date = validDate(getVal('mv-date'));
    const note = getVal('mv-note').trim().slice(0, 120);
    let qty;
    if (type === 'adjust') {
      const raw = getVal('mv-qty').replace(/\s/g, '');
      if (!/^\d+$/.test(raw)) { showToast('Indica quantas peças contaste (número inteiro).', 'warn'); return; }
      qty = parseInt(raw, 10) - s.phys;
      if (qty === 0) { showToast('A contagem é igual ao stock no sistema. Não há nada a ajustar.', 'warn'); return; }
    } else {
      qty = toInt(getVal('mv-qty'));
      if (qty < 1) { showToast('Indica uma quantidade igual ou superior a 1.', 'warn'); return; }
      if (type === 'sale' && qty > s.avail) {
        showToast(s.phys >= qty
          ? (s.avail > 0 ? 'Só há ' + plural(s.avail, 'peça disponível', 'peças disponíveis') : 'Não há peças disponíveis') + ': ' + plural(s.res, 'peça desta variante está reservada', 'peças desta variante estão reservadas') + '. Para entregar uma reserva, usa o separador Reservas.'
          : 'Só tens ' + plural(Math.max(0, s.phys), 'peça', 'peças') + ' em stock físico desta variante.', 'warn');
        return;
      }
      if ((type === 'sample' || type === 'loss') && qty > s.phys) { showToast('Só tens ' + plural(Math.max(0, s.phys), 'peça', 'peças') + ' em stock físico desta variante.', 'warn'); return; }
    }
    const m = { id: genId('m'), type, productId: p.id, variantId: v.id, qty, date, note };
    if (type === 'sale') {
      m.channel = getVal('mv-ch'); m.unitPrice = toNum(getVal('mv-price'));
      if (!m.unitPrice) { showToast('Indica o preço de venda por peça. Para peças oferecidas usa "Amostra / oferta".', 'warn'); return; }
    }
    if (type === 'return') m.unitPrice = toNum(getVal('mv-price'));
    if (type === 'in') m.unitCost = toNum(getVal('mv-cost'));
    lastMoveType = type;
    closeModal();
    commit({ moves: { add: [m] } });
    render();
    showToast(type === 'adjust' ? 'Ajuste registado (' + fmtSigned(qty) + ' ' + (Math.abs(qty) === 1 ? 'peça' : 'peças') + ').' : 'Movimento registado.');
  }

  function copyText(text, okMsg) {
    function fallback() {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
        document.body.appendChild(ta); ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(ok ? okMsg : 'Não foi possível copiar neste dispositivo.', ok ? '' : 'warn');
      } catch (e) { showToast('Não foi possível copiar neste dispositivo.', 'warn'); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => showToast(okMsg)).catch(fallback);
    else fallback();
  }
