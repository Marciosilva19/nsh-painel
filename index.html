      case 'del-move': guarded(null, () => confirmDeleteMove(id)); break;
      case 'new-res': openResModal(); break;
      case 'deliver-res': guarded(null, () => deliverRes(id)); break;
      case 'cancel-res': cancelRes(id); break;
      case 'add-collection': openCollectionModal(null); break;
      case 'edit-collection': openCollectionModal(id); break;
      case 'add-fixed': openFixedModal(null); break;
      case 'edit-fixed': openFixedModal(id); break;
      case 'delete-fixed': confirmDeleteFixed(id); break;
      case 'set-period': sim.period = el.dataset.period; sim.overrides = {}; state.lastPeriod = sim.period; lsSet(LS_PERIOD, sim.period); if (mode !== 'cloud') saveState(); render(); break;
      case 'retry-load': cloudStart(); break;
      case 'reset-sim': sim.overrides = {}; render(); break;
      case 'open-report': openReportModal(); break;
      case 'open-settings': openSettingsModal(); break;
      case 'login': doLogin(); break;
    }
  });
  content.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-sim-units]')) { sim.overrides[t.dataset.simUnits] = t.value; updateSimComputedOnly(); }
    else if (t.id === 'custom-days-input') { sim.customDays = t.value; refreshSimUnitInputs(); updateSimComputedOnly(); }
    else if (t.id === 'share-input') { state.wholesaleShare = Math.min(100, toNum(t.value)); updateSimComputedOnly(); }
  });
  content.addEventListener('change', e => {
    if (e.target.id === 'share-input') { const v = Math.min(100, toNum(e.target.value)); e.target.value = plain(v); commit({ catalog: c => { c.wholesaleShare = v; } }); }
  });
  content.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lg-pass') doLogin(); });
  content.addEventListener('focusout', () => { if (renderPending) setTimeout(() => { if (renderPending && !typing()) { renderPending = false; render(); } }, 0); });
  byId('app-nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) goTab(b.dataset.tab); });
  byId('btn-settings').addEventListener('click', openSettingsModal);

  modalRoot.addEventListener('click', e => {
    if (e.target.matches('.modal-overlay')) { closeModal(); confirmCallback = null; return; }
    const btn = e.target.closest('button'); if (!btn || !btn.dataset.action) return;
    const a = btn.dataset.action;
    switch (a) {
      case 'close-modal': closeModal(); break;
      case 'save-product': saveProductFromModal(); break;
      case 'delete-product-from-modal': { const pid = editingProductId; closeModal(); if (pid) confirmDeleteProduct(pid); break; }
      case 'save-move': guarded(btn, saveMove); break;
      case 'save-res': saveRes(); break;
      case 'save-collection': saveCollection(); break;
      case 'delete-collection': { const cid = editingCollectionId; closeModal(); if (cid) confirmDeleteCollection(cid); break; }
      case 'save-fixed': saveFixedFromModal(); break;
      case 'delete-fixed-from-modal': { const fid = editingFixedId; closeModal(); if (fid) confirmDeleteFixed(fid); break; }
      case 'close-confirm': closeModal(); confirmCallback = null; break;
      case 'do-confirm': { const cb = confirmCallback; closeModal(); confirmCallback = null; if (cb) cb(); break; }
      case 'copy-report': copyText(reportPlainText(simulate()), 'Relatório copiado.'); break;
      case 'set-cur': viewCur = btn.dataset.cur === 'USD' ? 'USD' : 'EUR'; lsSet(LS_CUR, viewCur); openSettingsModal(); render(); break;
      case 'copy-backup': copyText(JSON.stringify(state), 'Cópia de segurança copiada.'); break;
      case 'restore-backup': restoreBackup(); break;
      case 'logout': doLogout(); break;
      case 'reset-demo':
        closeModal();
        openConfirmModal('Queres repor os dados de exemplo? Vais perder os dados que tens agora.', () => {
          state = defaultState(); sim.overrides = {}; saveState(); render(); showToast('Dados de exemplo repostos.');
        }, 'Repor');
        break;
      case 'add-cost-row': {
        const rows = readCostRows(); rows.push({ id: genId('c'), label: '', value: '' });
        byId('cost-rows').innerHTML = rows.map(costRowHtml).join(''); refreshProductSummary(); break;
      }
      case 'remove-cost-row': {
        let rest = readCostRows().filter(c => c.id !== btn.dataset.id);
        if (!rest.length) rest = [{ id: genId('c'), label: '', value: '' }];
        byId('cost-rows').innerHTML = rest.map(costRowHtml).join(''); refreshProductSummary(); break;
      }
    }
  });
  modalRoot.addEventListener('input', e => {
    const t = e.target;
    if (t.closest('#product-form')) refreshProductSummary();
    if (t.id === 'mv-price') mv.priceTouched = true;
    if (t.id === 'mv-cost') mv.costTouched = true;
    if (t.id === 'rs-price') rs.priceTouched = true;
    if (t.id === 'rs-qty') syncRes();
  });
  modalRoot.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'mv-prod') { fillVariantSelect('mv-var', findProduct(t.value), null); mv.priceTouched = false; mv.costTouched = false; syncMove(); }
    else if (t.id === 'mv-type' || t.id === 'mv-var' || t.id === 'mv-ch') syncMove();
    else if (t.id === 'rs-prod') { fillVariantSelect('rs-var', findProduct(t.value), null); rs.priceTouched = false; syncRes(); }
    else if (t.id === 'rs-kind' || t.id === 'rs-var') syncRes();
  });

  /* ================= arranque ================= */
  async function init() {
    loadFx();
    sim.period = PERIODS[lsGet(LS_PERIOD)] ? lsGet(LS_PERIOD) : 'monthly';
    if (mode === 'cloud') {
      const saved = lsGet(LS_SESSION);
      if (saved) { try { session = JSON.parse(saved); } catch (e) { session = null; } }
      state = defaultState();
      if (!session) { render(); return; }
      await cloudStart();
      return;
    }
    await loadState();
    if (!PERIODS[lsGet(LS_PERIOD)]) sim.period = state.lastPeriod || 'monthly';
    render();
  }
  init().catch(err => {
    byId('app-content').innerHTML = '<div class="empty-state">Ocorreu um erro ao carregar os dados. Recarrega a página.</div>';
    if (window.console) console.error(err);
  });

  } catch (bootErr) {
    const el = document.getElementById('app-content');
    if (el) el.innerHTML = '<div class="empty-state">Ocorreu um erro ao iniciar o painel. Recarrega a página.</div>';
    if (window.console) console.error(bootErr);
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', nshBoot);
else nshBoot();
</script>
</body>
</html>
